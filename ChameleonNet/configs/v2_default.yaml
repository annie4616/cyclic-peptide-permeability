# ChameleonNet V2 — residue-resolved chameleonic, ID split.
# Differences from configs/default.yaml:
#   model_arch: v2 picks ChameleonNetV2 + auto-enables Δ-descriptor augment
#   lambda_residue_psa: V2-only aux that ties residue-level Δ to global ΔPSA

csv_path: /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/data/CycPeptMPDB-4D_with_assay_descriptors_preprocessed.csv
pdb_root: /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/CycPeptMPDB-4D
splits_dir: /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/splits
vocab_csvs:
  - /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/eda/water_residue_vocab.csv
  - /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/eda/hexane_residue_vocab.csv
cache_dir: /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/ChameleonNet/.cache_pdb
output_dir: /ssd0/sohyun/cyclic_peptide/cyclic_peptide_permeability/ChameleonNet/runs/v2_default

split_scheme: ID
use_trajectory: true
max_conformers: 16

model_arch: v2
augment_delta_descriptors: true

hidden_dim: 128
conformer_layers: 3
sequence_backend: learned
head_hidden: 256
dropout: 0.1

lambda_chameleonic: 0.1
lambda_triplet: 0.05
lambda_residue_psa: 0.05
pampa_baseline: -8.0

batch_size: 16
num_workers: 4
epochs: 100
lr: 0.0005
weight_decay: 0.00001
warmup_epochs: 5
grad_clip: 1.0

seed: 42
device: cuda
