# ChameleonNet V1 — OD_Murcko + scaffold adversary, SOFTER setting.
# Variant of v1_od_murcko_scafadv.yaml: weaker adversarial pressure after the
# default setting looked too strong on seed 42 (MAE 0.64, R2<0). Lower CE
# weight + GRL strength, fewer/coarser scaffold groups, longer GRL warmup.

csv_path: /hdd0/sohyun/cyclic-peptide-permeability/data/CycPeptMPDB-4D_with_assay_descriptors_preprocessed.csv
pdb_root: /hdd0/sohyun/cyclic-peptide-permeability/CycPeptMPDB-4D
splits_dir: /hdd0/sohyun/cyclic-peptide-permeability/splits
vocab_csvs:
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/water_residue_vocab.csv
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/hexane_residue_vocab.csv
cache_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/.cache_pdb
output_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/runs/v1_od_murcko_scafadv_soft

split_scheme: OD_Murcko
use_trajectory: true
max_conformers: 16

model_arch: v1
augment_delta_descriptors: false

hidden_dim: 128
conformer_layers: 3
sequence_backend: peptideclm
peptideclm_name_or_path: aaronfeller/peptideclm-2-mlm-base
head_hidden: 256
dropout: 0.1

lambda_chameleonic: 0.1
lambda_triplet: 0.0
lambda_residue_psa: 0.0
pampa_baseline: -8.0

# --- scaffold adversary (softer) ---
lambda_adv: 0.2          # 0.5 -> 0.2
adv_n_groups: 16         # 32 -> 16 (coarser groups)
adv_hidden: 128
adv_lambda_max: 0.5      # 1.0 -> 0.5 (gentler GRL)
adv_warmup_epochs: 15    # 10 -> 15 (slower ramp)

batch_size: 8
num_workers: 4
epochs: 80
lr: 0.0005
weight_decay: 0.00001
warmup_epochs: 5
grad_clip: 1.0
early_stop_patience: 15

eval_schemes:
  - OD_Murcko

seed: 42
device: cuda

wandb_project: chameleonnet-v2
wandb_run_name: v1_od_murcko_scafadv_soft_seed42
wandb_mode: offline
