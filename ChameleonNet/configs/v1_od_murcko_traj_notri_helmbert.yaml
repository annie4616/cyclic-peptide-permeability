# ChameleonNet V1 — OD_Murcko split, HELM-BERT sequence branch.
# Sequence-branch swap vs. v1_od_murcko_traj_notri.yaml: PeptideCLM → HELM-BERT.

csv_path: /hdd0/sohyun/cyclic-peptide-permeability/data/CycPeptMPDB-4D_with_assay_descriptors_preprocessed.csv
pdb_root: /hdd0/sohyun/cyclic-peptide-permeability/CycPeptMPDB-4D
splits_dir: /hdd0/sohyun/cyclic-peptide-permeability/splits
vocab_csvs:
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/water_residue_vocab.csv
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/hexane_residue_vocab.csv
cache_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/.cache_pdb
output_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/runs/v1_od_murcko_traj_notri_helmbert

split_scheme: OD_Murcko
use_trajectory: true
max_conformers: 16

model_arch: v1
augment_delta_descriptors: false

hidden_dim: 128
conformer_layers: 3
sequence_backend: helmbert
helmbert_name_or_path: Flansma/helm-bert
head_hidden: 256
dropout: 0.1

lambda_chameleonic: 0.1
lambda_triplet: 0.0
lambda_residue_psa: 0.0
pampa_baseline: -8.0

batch_size: 8
num_workers: 4
epochs: 80
lr: 0.0005
weight_decay: 0.00001
warmup_epochs: 5
grad_clip: 1.0
early_stop_patience: 15

eval_schemes:
  - OD_Murcko

seed: 42
device: cuda

wandb_project: chameleonnet-v2
wandb_run_name: v1_od_murcko_traj_notri_helmbert
wandb_mode: online
