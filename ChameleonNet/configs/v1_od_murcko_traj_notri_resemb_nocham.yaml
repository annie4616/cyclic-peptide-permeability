# ChameleonNet V1 — OD_Murcko split, trajectory conformers, no triplet loss.
# Ablation vs v1_od_murcko_traj_notri_resemb: chameleonic auxiliary loss
# removed (lambda_chameleonic=0). See ID counterpart for rationale.

csv_path: /hdd0/sohyun/cyclic-peptide-permeability/data/CycPeptMPDB-4D_with_assay_descriptors_preprocessed.csv
pdb_root: /hdd0/sohyun/cyclic-peptide-permeability/CycPeptMPDB-4D
splits_dir: /hdd0/sohyun/cyclic-peptide-permeability/splits
vocab_csvs:
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/water_residue_vocab.csv
  - /hdd0/sohyun/cyclic-peptide-permeability/eda/hexane_residue_vocab.csv
cache_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/.cache_pdb
output_dir: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/runs/v1_od_murcko_traj_notri_resemb_nocham

split_scheme: OD_Murcko
use_trajectory: true
max_conformers: 16

model_arch: v1
augment_delta_descriptors: false

hidden_dim: 128
conformer_layers: 3
sequence_backend: peptideclm
peptideclm_name_or_path: aaronfeller/peptideclm-2-mlm-base
head_hidden: 256
dropout: 0.1

residue_emb_path: /hdd0/sohyun/cyclic-peptide-permeability/ChameleonNet/data/residue_embeddings/peptideclm_residue_emb.pt

lambda_chameleonic: 0.0
lambda_triplet: 0.0
lambda_residue_psa: 0.0
pampa_baseline: -8.0

batch_size: 8
num_workers: 4
epochs: 80
lr: 0.0005
weight_decay: 0.00001
warmup_epochs: 5
grad_clip: 1.0
early_stop_patience: 15

eval_schemes:
  - OD_Murcko

seed: 42
device: cuda

wandb_project: chameleonnet-v2
wandb_run_name: v1_od_murcko_traj_notri_resemb_nocham
wandb_mode: online
